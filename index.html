<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Coloring Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    body { margin: 0; background-color: #fffaf5; }
    input[type="range"] { accent-color: #f59e0b; }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    
    const Icon = ({ name, size = 24, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && lucide.icons[name]) {
          iconRef.current.innerHTML = '';
          const icon = lucide.createElement(lucide.icons[name]);
          icon.setAttribute('width', size);
          icon.setAttribute('height', size);
          iconRef.current.appendChild(icon);
        }
      }, [name, size]);
      return <span ref={iconRef} className={className} style={{display: 'inline-flex', verticalAlign: 'middle'}} />;
    };

    const CozyColoringApp = () => {
      const canvasRef = useRef(null);
      const colorWheelRef = useRef(null);
      const lineWorkRef = useRef(null);
      const [ctx, setCtx] = useState(null);
      const [mode, setMode] = useState('fill');
      const [currentColor, setCurrentColor] = useState('#FF6B9D');
      const [hue, setHue] = useState(340);
      const [saturation, setSaturation] = useState(100);
      const [lightness, setLightness] = useState(70);
      const [isDrawing, setIsDrawing] = useState(false);
      const [brushSize, setBrushSize] = useState(15);
      const [eraserSize, setEraserSize] = useState(20);
      const [imageData, setImageData] = useState(null);
      const [history, setHistory] = useState([]);
      const [currentImageName, setCurrentImageName] = useState('Generate or upload a coloring page');
      
      const [apiKey, setApiKey] = useState('');
      const [showApiKeyInput, setShowApiKeyInput] = useState(false);
      const [apiKeyTemp, setApiKeyTemp] = useState('');
      
      const [imagePrompt, setImagePrompt] = useState('');
      const [isGeneratingImage, setIsGeneratingImage] = useState(false);
      const [imageError, setImageError] = useState(null);
      const [recentColors, setRecentColors] = useState([]);

      useEffect(() => {
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) setApiKey(savedKey);

        const canvas = canvasRef.current;
        const context = canvas.getContext('2d', { willReadFrequently: true });
        setCtx(context);
        context.fillStyle = 'white';
        context.fillRect(0, 0, canvas.width, canvas.height);
        const initialData = context.getImageData(0, 0, canvas.width, canvas.height);
        setImageData(initialData);
        lineWorkRef.current = initialData;
        setHistory([initialData]);
        
        drawColorWheel();
      }, []);

      const drawColorWheel = () => {
        const colorWheel = colorWheelRef.current;
        if (!colorWheel) return;
        const wheelCtx = colorWheel.getContext('2d');
        const centerX = colorWheel.width / 2, centerY = colorWheel.height / 2;
        const radius = colorWheel.width / 2 - 5;
        for (let angle = 0; angle < 360; angle++) {
          const startAngle = (angle - 90) * Math.PI / 180;
          const endAngle = (angle + 1 - 90) * Math.PI / 180;
          wheelCtx.beginPath();
          wheelCtx.moveTo(centerX, centerY);
          wheelCtx.arc(centerX, centerY, radius, startAngle, endAngle);
          wheelCtx.fillStyle = `hsl(${angle}, 100%, 50%)`;
          wheelCtx.fill();
        }
        wheelCtx.beginPath();
        wheelCtx.arc(centerX, centerY, radius * 0.3, 0, Math.PI * 2);
        wheelCtx.fillStyle = 'white';
        wheelCtx.fill();
      };

      const hslToHex = (h, s, l) => {
        l /= 100; const a = s * Math.min(l, 1 - l) / 100;
        const f = n => {
          const k = (n + h / 30) % 12;
          const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
          return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
      };

      const handleColorWheelClick = (e) => {
        const rect = colorWheelRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left - 75, y = e.clientY - rect.top - 75;
        const dist = Math.sqrt(x*x + y*y);
        if (dist < 20) { selectColor('#FFFFFF'); return; }
        if (dist > 75) return;
        let angle = Math.atan2(y, x) * 180 / Math.PI + 90;
        if (angle < 0) angle += 360;
        const hex = hslToHex(angle, 100, 50);
        selectColor(hex);
      };

      const selectColor = (hex) => {
        setCurrentColor(hex);
        setRecentColors(prev => [hex, ...prev.filter(c => c !== hex)].slice(0, 10));
      };

      const saveToHistory = () => {
        const data = ctx.getImageData(0, 0, 800, 800);
        setHistory(prev => [...prev.slice(-19), data]);
      };

      const undo = () => {
        if (history.length <= 1) return;
        const newHistory = [...history];
        newHistory.pop();
        const prevState = newHistory[newHistory.length - 1];
        ctx.putImageData(prevState, 0, 0);
        setImageData(prevState);
        setHistory(newHistory);
      };

      const generateColoringPage = async () => {
        if (!imagePrompt.trim() || isGeneratingImage) return;
        if (!apiKey) { setShowApiKeyInput(true); return; }
        
        setIsGeneratingImage(true);
        setImageError(null);
        
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `High quality coloring book page of ${imagePrompt}. Bold black outlines, pure white background, no shading, line art style.` }] }],
              generationConfig: { response_modalities: ["IMAGE"] }
            })
          });
          
          const data = await response.json();
          const imgPart = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
          
          if (imgPart) {
            const img = new Image();
            img.onload = () => {
              ctx.fillStyle = 'white';
              ctx.fillRect(0,0,800,800);
              ctx.drawImage(img, 0, 0, 800, 800);
              const processed = ctx.getImageData(0,0,800,800);
              lineWorkRef.current = processed;
              setImageData(processed);
              setHistory([processed]);
              setCurrentImageName(imagePrompt);
            };
            img.src = `data:image/png;base64,${imgPart.inlineData.data}`;
            setImagePrompt('');
          } else {
            throw new Error(data.error?.message || "Model didn't return an image. Verify your API key has Image capabilities.");
          }
        } catch (err) {
          setImageError(err.message);
        } finally {
          setIsGeneratingImage(false);
        }
      };

      const floodFill = (startX, startY) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((startX - rect.left) * (800 / rect.width));
        const y = Math.floor((startY - rect.top) * (800 / rect.height));
        
        const imgData = ctx.getImageData(0, 0, 800, 800);
        const data = imgData.data;
        const targetIdx = (y * 800 + x) * 4;
        const targetR = data[targetIdx], targetG = data[targetIdx+1], targetB = data[targetIdx+2];
        
        if (targetR < 50 && targetG < 50 && targetB < 50) return; // Don't fill lines

        const fillRGB = hexToRgb(currentColor);
        if (targetR === fillRGB.r && targetG === fillRGB.g && targetB === fillRGB.b) return;

        const stack = [[x, y]];
        while (stack.length) {
          const [cx, cy] = stack.pop();
          const idx = (cy * 800 + cx) * 4;
          if (cx < 0 || cx >= 800 || cy < 0 || cy >= 800) continue;
          if (data[idx] === targetR && data[idx+1] === targetG && data[idx+2] === targetB) {
            data[idx] = fillRGB.r; data[idx+1] = fillRGB.g; data[idx+2] = fillRGB.b; data[idx+3] = 255;
            stack.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
          }
        }
        ctx.putImageData(imgData, 0, 0);
        setImageData(imgData);
        saveToHistory();
      };

      const hexToRgb = (hex) => {
        const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
        return { r, g, b };
      };

      const handleDraw = (e) => {
        if (!isDrawing || mode === 'fill') return;
        const rect = canvasRef.current.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (800 / rect.width);
        const y = (e.clientY - rect.top) * (800 / rect.height);
        
        ctx.beginPath();
        ctx.arc(x, y, mode === 'brush' ? brushSize : eraserSize, 0, Math.PI * 2);
        ctx.fillStyle = mode === 'brush' ? currentColor : 'white';
        ctx.fill();
        
        // Re-apply linework over drawing
        if (lineWorkRef.current) {
          const current = ctx.getImageData(0,0,800,800);
          for(let i=0; i<current.data.length; i+=4) {
            if (lineWorkRef.current.data[i] < 50) {
              current.data[i] = 0; current.data[i+1] = 0; current.data[i+2] = 0;
            }
          }
          ctx.putImageData(current, 0, 0);
        }
      };

      return (
        <div className="min-h-screen p-4 md:p-8">
          <div className="max-w-6xl mx-auto grid lg:grid-cols-[1fr,320px] gap-8">
            <div className="space-y-4">
              <header className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border-2 border-orange-100">
                <h1 className="text-2xl font-bold text-orange-600 flex items-center gap-2">
                  <Icon name="Palette" /> Cozy Studio
                </h1>
                <div className="flex gap-2">
                  <button onClick={() => setMode('fill')} className={`p-2 rounded-lg ${mode === 'fill' ? 'bg-orange-500 text-white' : 'bg-orange-50'}`}><Icon name="Droplet" size={20}/></button>
                  <button onClick={() => setMode('brush')} className={`p-2 rounded-lg ${mode === 'brush' ? 'bg-orange-500 text-white' : 'bg-orange-50'}`}><Icon name="Paintbrush" size={20}/></button>
                  <button onClick={() => setMode('eraser')} className={`p-2 rounded-lg ${mode === 'eraser' ? 'bg-orange-500 text-white' : 'bg-orange-50'}`}><Icon name="Eraser" size={20}/></button>
                </div>
              </header>

              <div className="bg-white p-2 rounded-3xl shadow-xl border-4 border-orange-200 aspect-square relative overflow-hidden">
                <canvas ref={canvasRef} width={800} height={800} className="w-full h-full cursor-crosshair"
                  onClick={(e) => mode === 'fill' && floodFill(e.clientX, e.clientY)}
                  onMouseDown={() => setIsDrawing(true)}
                  onMouseMove={handleDraw}
                  onMouseUp={() => { if(isDrawing) { setIsDrawing(false); saveToHistory(); }}}
                />
              </div>
            </div>

            <div className="space-y-6">
              <div className="bg-white p-5 rounded-2xl shadow-lg border-2 border-purple-100">
                <h3 className="font-bold text-purple-700 mb-3 flex items-center gap-2"><Icon name="Sparkles" size={18}/> AI Page Creator</h3>
                <input type="password" placeholder="Gemini API Key" className="w-full p-2 mb-2 text-xs border rounded-lg" 
                  value={apiKeyTemp} onChange={e => setApiKeyTemp(e.target.value)} onBlur={() => { localStorage.setItem('gemini_api_key', apiKeyTemp); setApiKey(apiKeyTemp); }} />
                <textarea placeholder="Describe your page..." className="w-full p-2 text-sm border rounded-lg h-20 mb-2" 
                  value={imagePrompt} onChange={e => setImagePrompt(e.target.value)} />
                <button onClick={generateColoringPage} disabled={isGeneratingImage} className="w-full py-2 bg-purple-600 text-white rounded-xl font-bold hover:bg-purple-700 disabled:bg-gray-300">
                  {isGeneratingImage ? 'Generating...' : 'Create Magic Page'}
                </button>
                {imageError && <p className="text-red-500 text-[10px] mt-1">{imageError}</p>}
              </div>

              <div className="bg-white p-5 rounded-2xl shadow-lg border-2 border-orange-100">
                <canvas ref={colorWheelRef} width={150} height={150} className="mx-auto mb-4 cursor-pointer" onClick={handleColorWheelClick} />
                <div className="flex flex-wrap gap-2 mb-4">
                  {recentColors.map(c => (
                    <button key={c} onClick={() => setCurrentColor(c)} className="w-8 h-8 rounded-full border shadow-sm" style={{backgroundColor: c}} />
                  ))}
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={undo} className="py-2 bg-blue-500 text-white rounded-lg text-sm font-bold">Undo</button>
                  <button onClick={() => { ctx.fillStyle='white'; ctx.fillRect(0,0,800,800); ctx.putImageData(lineWorkRef.current,0,0); saveToHistory(); }} className="py-2 bg-gray-500 text-white rounded-lg text-sm font-bold">Clear</button>
                  <button onClick={() => { const link = document.createElement('a'); link.download='coloring.png'; link.href=canvasRef.current.toDataURL(); link.click(); }} className="col-span-2 py-2 bg-emerald-600 text-white rounded-lg font-bold">Download Result</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CozyColoringApp />);
  </script>
</body>
</html>
